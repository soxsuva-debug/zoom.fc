<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZOOM.FC | Rematch Esports Elite</title>

    <meta name="theme-color" content="#737373">

    <style>
        :root {
            --bg-deep: #020202;
            --bg-card: #080808;
            --bg-card-hover: #101010;
            --border-color: #1a1a1a;
            --border-glow: #333333;
            --text-main: #f8f9fa;
            --text-muted: #737373;
            --accent: #ffffff;
            --accent-dim: rgba(255, 255, 255, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; scroll-behavior: smooth; }
        
        body { 
            background-color: var(--bg-deep); 
            color: var(--text-main); 
            line-height: 1.6; 
            overflow-x: hidden;
            position: relative;
        }

        /* Snowflake Background Canvas */
        #snow-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: -1;
        }

        /* Cyber Glass Header */
        header { 
            background: rgba(2, 2, 2, 0.85); 
            backdrop-filter: blur(20px); 
            border-bottom: 1px solid var(--border-color); 
            position: fixed; top: 0; width: 100%; z-index: 1000; 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 1.2rem 6%; 
            animation: slideDownHeader 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideDownHeader {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .logo { 
            font-weight: 900; font-size: 1.35rem; letter-spacing: 3px; 
            color: var(--accent); text-decoration: none; 
            text-shadow: 0 0 25px rgba(255,255,255,0.25);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .logo:hover { transform: scale(1.05); }

        nav { display: flex; gap: 2.5rem; }
        nav a { 
            color: var(--text-muted); text-decoration: none; font-size: 0.85rem; 
            font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; 
            transition: color 0.3s ease, text-shadow 0.3s ease, transform 0.3s ease; 
        }
        nav a:hover { 
            color: var(--accent); 
            text-shadow: 0 0 12px rgba(255,255,255,0.6); 
            transform: translateY(-2px);
        }

        /* Ultra-Smooth Scroll-Driven Fade & Slide Transition Effects */
        section { 
            padding: 9rem 6% 7rem; 
            max-width: 1350px; 
            margin: 0 auto; 
            border-bottom: 1px solid var(--border-color); 
            opacity: 0; 
            transform: translateY(60px); 
            transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: opacity, transform;
            position: relative;
            z-index: 1;
        }

        section.active-section {
            opacity: 1;
            transform: translateY(0);
        }

        /* Hero / Home Section */
        .hero { 
            text-align: center; 
            padding: 12rem 6% 7rem; 
            background: radial-gradient(circle at center, #0a0a0a 0%, var(--bg-deep) 80%);
            position: relative;
        }
        .hero h1 { 
            font-size: clamp(2.8rem, 7vw, 5rem); 
            font-weight: 900; 
            letter-spacing: -1.5px; 
            margin-bottom: 1.5rem; 
            background: linear-gradient(180deg, #ffffff 20%, #666666 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: titleGlow 4s ease-in-out infinite alternate, floatTitle 6s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
            0% { filter: drop-shadow(0 0 15px rgba(255,255,255,0.1)); }
            100% { filter: drop-shadow(0 0 35px rgba(255,255,255,0.3)); }
        }

        @keyframes floatTitle {
            0% { transform: translateY(0); }
            100% { transform: translateY(-6px); }
        }

        .hero p { 
            color: var(--text-muted); 
            max-width: 700px; 
            margin: 0 auto; 
            font-size: 1.15rem; 
            line-height: 1.8;
        }

        /* Cards Layout */
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 2.2rem; margin-top: 4rem; }
        
        .card { 
            background: var(--bg-card); 
            border: 1px solid var(--border-color); 
            padding: 2.8rem; 
            border-radius: 18px; 
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s ease, box-shadow 0.4s ease, background 0.4s ease;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.7), transparent);
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .card:hover { 
            transform: translateY(-10px) scale(1.01); 
            border-color: var(--border-glow); 
            background: var(--bg-card-hover);
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), 0 0 20px rgba(255,255,255,0.03); 
        }
        .card:hover::before { opacity: 1; }
        .card h3 { font-size: 1.4rem; margin-bottom: 1rem; color: var(--accent); font-weight: 800; letter-spacing: -0.5px; }
        .card p { color: var(--text-muted); font-size: 0.95rem; line-height: 1.75; }

        /* Core Roster & Leadership Section */
        .roster-container { max-width: 1000px; margin: 0 auto; }
        
        /* Franchise Owner Layout */
        .owner-card { 
            background: linear-gradient(135deg, #0d0d0d, #050505); 
            border: 1px solid var(--border-glow); 
            border-radius: 20px; 
            display: flex; flex-direction: column; align-items: center; 
            padding: 2.8rem; gap: 2.5rem; 
            position: relative; overflow: hidden; margin-bottom: 2.5rem;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease, border-color 0.4s ease; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .owner-card:hover, .owner-card.hover-state { 
            transform: translateY(-8px) scale(1.01); 
            border-color: var(--accent); 
            box-shadow: 0 35px 70px rgba(255,255,255,0.08), 0 0 30px rgba(255,255,255,0.05); 
        }
        .owner-img-container { 
            width: 140px; height: 140px; border-radius: 50%; overflow: hidden; 
            border: 2px solid var(--accent); flex-shrink: 0; background: #111; 
            box-shadow: 0 0 25px rgba(255,255,255,0.12);
            transition: box-shadow 0.4s ease;
        }
        .owner-card:hover .owner-img-container, .owner-card.hover-state .owner-img-container { box-shadow: 0 0 35px rgba(255,255,255,0.3); }
        .owner-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        .owner-card:hover .owner-img, .owner-card.hover-state .owner-img { transform: scale(1.12) rotate(2deg); }
        .owner-info { text-align: center; flex-grow: 1; }
        @media(min-width: 768px) { 
            .owner-card { flex-direction: row; text-align: left; } 
            .owner-info { text-align: left; } 
        }
        
        .badge { 
            display: inline-block; background: var(--accent); color: var(--bg-deep); 
            font-size: 0.75rem; font-weight: 900; padding: 0.35rem 0.9rem; 
            border-radius: 30px; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 1rem; 
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .owner-card:hover .badge, .owner-card.hover-state .badge { transform: scale(1.05); box-shadow: 0 0 15px rgba(255,255,255,0.5); }
        .member-name { font-size: 2.2rem; font-weight: 900; color: var(--accent); margin-bottom: 0.4rem; letter-spacing: -0.5px; }
        .member-desc { color: var(--text-muted); font-size: 0.95rem; line-height: 1.7; }

        /* Roster Grid */
        .duo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2.2rem; }
        .player-card { 
            background: var(--bg-card); 
            border: 1px solid var(--border-color); 
            border-radius: 18px; overflow: hidden; text-align: center; padding-bottom: 2rem; 
            position: relative; 
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s ease, box-shadow 0.4s ease; 
        }
        .player-card:hover, .player-card.hover-state { 
            transform: translateY(-10px) scale(1.02); 
            border-color: var(--border-glow); 
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), 0 0 20px rgba(255,255,255,0.03); 
        }
        .player-img-container { 
            width: 100%; height: 260px; background: #0c0c0c; overflow: hidden; 
            border-bottom: 1px solid var(--border-color); position: relative; 
        }
        .player-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        .player-card:hover .player-img, .player-card.hover-state .player-img { transform: scale(1.12) rotate(-2deg); }
        .player-name { font-size: 1.4rem; font-weight: 800; margin: 1.5rem 0 0.3rem; color: var(--accent); }
        .player-role { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; }
        
        /* Action buttons container */
        .card-actions {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            padding: 0 1.5rem;
        }

        .action-hint { 
            display: inline-block; padding: 0.55rem 1.2rem; background: var(--accent-dim); 
            border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; 
            font-size: 0.8rem; font-weight: 700; letter-spacing: 0.5px; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); 
        }
